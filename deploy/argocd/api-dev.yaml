apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mdondor/plateforme-devops.git
    targetRevision: main
    path: deploy/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true          # supprime du cluster ce qui disparaît de Git
      selfHeal: true       # annule toute modif manuelle
    syncOptions:
      - CreateNamespace=true   # crée le namespace dev s'il n'existe pas
